services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ryvano-web:latest
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ryano}:${POSTGRES_PASSWORD:-ryano}@postgres:5432/${POSTGRES_DB:-ryano}?schema=public"
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ryvano-web:latest
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-19595}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ryano}:${POSTGRES_PASSWORD:-ryano}@postgres:5432/${POSTGRES_DB:-ryano}?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-change-me-before-production}"
      AUTH_URL: "${AUTH_URL:-http://localhost:19595}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:19595}"
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:-true}"
      APP_URL: "${APP_URL:-http://localhost:19595}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-change-me-before-production}"
      SEND_API_URL: "${SEND_API_URL:-}"
      SEND_API_KEY: "${SEND_API_KEY:-}"
      SEND_FROM: "${SEND_FROM:-}"
      GARMIN_SERVICE_BASE_URL: "${GARMIN_SERVICE_BASE_URL:-http://host.docker.internal:8001}"
      GARMIN_ADMIN_KEY: "${GARMIN_ADMIN_KEY:-}"
      EVOLUTION_API_BASE_URL: "${EVOLUTION_API_BASE_URL:-http://evolution:8080}"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:-change-me-before-production}"
      EVOLUTION_INSTANCE_NAME: "${EVOLUTION_INSTANCE_NAME:-ryano}"
      EVOLUTION_WEBHOOK_SECRET: "${EVOLUTION_WEBHOOK_SECRET:-}"
      EVOLUTION_WEBHOOK_EVENTS: "${EVOLUTION_WEBHOOK_EVENTS:-QRCODE_UPDATED,CONNECTION_UPDATE,GROUPS_UPSERT,GROUP_UPDATE,GROUP_PARTICIPANTS_UPDATE,MESSAGES_UPSERT}"
      EVOLUTION_ALLOW_HTTP_FALLBACK: "${EVOLUTION_ALLOW_HTTP_FALLBACK:-true}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(async (response) => { const payload = await response.json().catch(() => null); process.exit(response.ok && payload?.ready ? 0 : 1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-9596}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ryano}"
      POSTGRES_USER: "${POSTGRES_USER:-ryano}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ryano}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ryano} -d ${POSTGRES_DB:-ryano}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  evolution_instances:
