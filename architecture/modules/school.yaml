id: school
name: Escola, coaching, training and athlete history
status: complete  # T000–T372 implemented; T367–T372 pending env activation
paths:
  - modules/school
  - app/api/schools
  - app/api/workout-assignments
  - app/api/workout-executions
  - app/api/athletes
  - app/api/invitations
  - app/atleta
  - app/escola
  - app/professor
  - app/entrar/convite
  - prisma/schema.prisma
owns:
  - temporal school memberships and multi-role system (OWNER, ADMIN)
  - coach school memberships and coach-athlete assignments
  - derived lobby (pending memberships awaiting approval)
  - invitation links with bearer-token security and revocation
  - workout prescriptions, snapshots, and assignment lifecycle
  - activity-to-workout matching with sport-specific scoring
  - sport-specific compliance calculation (run/bike/swim/default strategies)
  - coach evaluations and athlete feedback on executions
  - explicit athlete-owned history access grants with scoped revocable consent
  - school audit log and structured observability (schoolLogger, schoolMetrics)
depends_on:
  - existing User identity and auth session (next-auth)
  - persisted normalized Activity data (wearable integrations)
  - Prisma transactions and schema migrations 0001–0029
infrastructure:
  feature_flag: SCHOOL_MODULE_ENABLED (default false; gates all routes and job consumers)
  logging: schoolLogger (structured, per-call correlationId) in modules/school/infrastructure/logger.ts
  metrics: schoolMetrics (matching outcomes, compliance scores, errors) in modules/school/infrastructure/metrics.ts
  security: see architecture/escola-security-review.md and architecture/escola-permission-rules.md
  migration_checklist: architecture/escola-migration-checklist.md
  rollback_plan: architecture/escola-rollback-plan.md
  seed: prisma/seed.ts (run with `pnpm db:seed`)
invariants:
  - athleteId is User.id; do not duplicate AthleteProfile
  - school roles are scoped per school; unrelated to global ADMIN
  - no provider imports or remote activity refetch inside school module
  - historical foreign keys Restrict; ending relationships never deletes history
  - ownership, authorship and access are separate concerns
  - history consent belongs exclusively to the athlete; no admin override
  - workout snapshots are immutable after creation; compliance is versioned
conventions:
  ids: String cuid generated by Prisma; validate nonempty opaque IDs without rewriting them
  timestamps: UTC Date in domain and persistence; ISO 8601 in HTTP; inject clock in use cases
  temporal: startedAt null while pending; endedAt terminates a period; return creates a new row
  soft_delete: explicit status and endedAt/revokedAt/archivedAt; no normal hard-delete commands
  errors: typed domain error with stable code and safe message; HTTP code/message/details envelope
  error_status: validation 400; unauthenticated 401; forbidden 403; absent 404; conflict 409
  pagination: default 20 and maximum 100; fetch limit+1; stable ID tie-breaker
  cursor: opaque validated ID cursor for ID-ordered queries; composite date+ID for chronological queries
  response: single resources directly; lists as items/nextCursor; no fabricated totals
  validation: strict Zod DTOs at boundary and domain invariant checks in use cases
  authorization: authenticated actor from server session; never trust owner/roles supplied by clients
  transactions: compound state changes and audit records commit together in serializable transactions
  feature_flag: SCHOOL_MODULE_ENABLED defaults disabled; gate server entrypoints and job consumers
validation:
  - 158 Vitest test files / 1872 tests — all passing
  - tsc --noEmit clean
  - real PostgreSQL migrations with CHECK constraints
  - GitNexus impact before existing symbol changes and detect-changes before commits
references:
  - architecture/ryvano-escola-integration.md
  - architecture/escola-permission-rules.md
  - architecture/escola-security-review.md
  - architecture/escola-migration-checklist.md
  - architecture/escola-rollback-plan.md
  - architecture/adr/school
  - .kiro/specs/ryvano-escola-spec/implementation.md
