id: school
name: Escola, coaching, training and athlete history
status: complete  # T000–T372 implemented; T367–T372 pending env activation
paths:
  - modules/school
  - app/api/schools
  - app/api/workout-assignments
  - app/api/workout-executions
  - app/api/athletes
  - app/api/invitations
  - app/atleta
  - app/escola
  - app/professor
  - app/entrar/convite
  - prisma/schema.prisma
owns:
  - temporal school memberships and multi-role system (OWNER, ADMIN)
  - coach school memberships and coach-athlete assignments
  - derived lobby (pending memberships awaiting approval)
  - invitation links with bearer-token security and revocation
  - workout prescriptions, snapshots, and assignment lifecycle
  - activity-to-workout matching with sport-specific scoring
  - sport-specific compliance calculation (run/bike/swim/default strategies)
  - coach evaluations and athlete feedback on executions
  - explicit athlete-owned history access grants with scoped revocable consent
  - school audit log and structured observability (schoolLogger, schoolMetrics)
depends_on:
  - existing User identity and auth session (next-auth)
  - persisted normalized Activity data (wearable integrations)
  - Prisma transactions and schema migrations 0001–0029
infrastructure:
  feature_flag: SCHOOL_MODULE_ENABLED (default false; gates all routes and job consumers)
  logging: schoolLogger (structured, per-call correlationId) in modules/school/infrastructure/logger.ts
  metrics: schoolMetrics (matching outcomes, compliance scores, errors) in modules/school/infrastructure/metrics.ts
  security: see architecture/escola-security-review.md and architecture/escola-permission-rules.md
  migration_checklist: architecture/escola-migration-checklist.md
  rollback_plan: architecture/escola-rollback-plan.md
  seed: prisma/seed.ts (run with `pnpm db:seed`)
invariants:
  - athleteId is User.id; do not duplicate AthleteProfile
  - school roles are scoped per school; unrelated to global ADMIN
  - no provider imports or remote activity refetch inside school module
  - historical foreign keys Restrict; ending relationships never deletes history
  - ownership, authorship and access are separate concerns
  - history consent belongs exclusively to the athlete; no admin override
  - workout snapshots are immutable after creation; compliance is versioned
  - scheduled wall-clock times are read and shown in School.timezone (SAM-16); persistence stays UTC — use cases accept `scheduledAtLocal` and convert with modules/school/domain/local-date.ts, never the server or browser zone
  - training zones are derived from the sheet or from the coach's versioned zone profile (SAM-70: ZoneProfile/ZoneProfileVersion, N zones by % of one reference, associated per family in AthleteTechnicalSheet.zoneProfileVersions; absent = the derived default below), never stored as athlete values; a prescription freezes snapshot.content.reference {sheetRevisionId, parameters, zoneProfiles, citations} at publication and a promoted assessment (AthleteAssessment → revision.assessmentId) never rewrites it (domain/training-zones.ts: FC by %FCmáx/%HRR/%LTHR per AthleteTechnicalSheet.heartRateZoneMethod, pace/power/CSS by % of threshold); every change to a tracked parameter writes an AthleteTechnicalSheetRevision with from/to values (SAM-18); the builder's extra target kind comes from the sport's metric display category, never from the sport name
  - athlete volume counts everything the athlete did — matched executions, self-logged sessions and imported activities nobody matched (application/load-athlete-sessions.ts), in Monday-anchored weeks of School.timezone; adherence is a separate layer; HR load only per ADR-007 (SAM-20)
  - WorkoutExecution.activityId is the explicit link to the imported Activity, resolved by (UPPER(source), externalId, athleteId) in infrastructure/activity-link.ts at match time (SAM-17); WorkoutAssignment.matchedActivityId mirrors the matched execution (auto/confirm/override write it, unmatch clears it). Activity detail (zones/laps) is loaded through an injected provider-module loader; the school module never imports a provider
  - independent coaching (SAM-30, ADR-009): every coach-facing athlete use case takes a scope (`string` = school, `{ kind: "independent" }`) through ResolveCoachAthleteContext; the independent prescription scope is ALWAYS `{ schoolId: null, coachId }` (application/coach-athlete-scope.ts) — never `schoolId: null` alone, which marketplace-licence and self-logged rows share; the school scope stays exactly `{ schoolId }`
  - the technical sheet belongs to one coaching relationship: (schoolId, athleteId) inside a school, (coachId, athleteId) with schoolId NULL outside one (partial unique, migration 0056); independent prescriptions, sheets and evaluations write no SchoolAuditLog row
  - automatic matching (SAM-33) runs through ONE provider-agnostic hook, application/match-persisted-activity.ts, called by every provider right after it upserts an Activity; it never throws, skips activities that already have an execution or marked duplicateOfActivityId (SAM-39: the mirror of a session from another connection never becomes a second execution), and a different sport never matches — the activity stays "unplanned". Prescription and execution remain separate rows; prescribed × executed is DERIVED (domain/prescription-outcome.ts), never a stored status
  - "unplanned activity" = an Activity no matched execution points at (application/unplanned-activities.ts); the coach sees imported and self-logged sessions from the link's periodStart, and earlier dates only where the athlete granted the `activities` consent category (ADR-005)
  - the coach reads an activity (SAM-34) through GetCoachAthleteActivities/GetCoachAthleteActivityDetail with the same scope rules as prescriptions; the detail view is the athlete's own (components/activities/activity-detail-view.tsx) and a reader who is not the owner never edits the athlete's title
  - the athlete's own list and calendar (SAM-41) read the SAME use case with scope `{ kind: "self" }` (actor must be the athlete; whole history; every prescription is theirs) — never a second Prisma query path; an imported activity a matched execution represents is shown once, by its prescription, and the unmatched one as "Não planejada" (timeline unmatchedActivities over splitLinkedActivities)
  - the coach's calendar (SAM-36, GetCoachWeeklyAgenda) is one use case for both scopes and shows planned AND done: prescriptions with their derived outcome, unplanned imports and self-logged sessions as their own item kinds; a wall-clock time outside a school is read in the athlete's zone (resolveAthleteTimeZone), never a fixed one
  - one ACTIVE independent CoachAthleteAssignment per (athleteId, coachId) (partial unique, migration 0056); a transfer is always "close a period, open a period", proposed by the coach and confirmed by the athlete: `reason = moved_with_coach` (into a school, SAM-29 flow) / `reason = moved_from_school` (out of a school: the PENDING independent row IS the proposal — the coach never accepts it, ListCoachAssignmentRequests and the badge skip it, the athlete's school membership stays ACTIVE when it is confirmed)
conventions:
  ids: String cuid generated by Prisma; validate nonempty opaque IDs without rewriting them
  timestamps: UTC Date in domain and persistence; ISO 8601 in HTTP; inject clock in use cases
  temporal: startedAt null while pending; endedAt terminates a period; return creates a new row
  soft_delete: explicit status and endedAt/revokedAt/archivedAt; no normal hard-delete commands
  errors: typed domain error with stable code and safe message; HTTP code/message/details envelope
  error_status: validation 400; unauthenticated 401; forbidden 403; absent 404; conflict 409
  pagination: default 20 and maximum 100; fetch limit+1; stable ID tie-breaker
  cursor: opaque validated ID cursor for ID-ordered queries; composite date+ID for chronological queries
  response: single resources directly; lists as items/nextCursor; no fabricated totals
  validation: strict Zod DTOs at boundary and domain invariant checks in use cases
  authorization: authenticated actor from server session; never trust owner/roles supplied by clients
  transactions: compound state changes and audit records commit together in serializable transactions
  feature_flag: SCHOOL_MODULE_ENABLED defaults disabled; gate server entrypoints and job consumers
validation:
  - 158 Vitest test files / 1872 tests — all passing
  - tsc --noEmit clean
  - real PostgreSQL migrations with CHECK constraints
  - GitNexus impact before existing symbol changes and detect-changes before commits
references:
