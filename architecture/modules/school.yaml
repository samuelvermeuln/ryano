id: school
name: Escola, coaching, training and athlete history
status: implementation
paths:
  - modules/school
  - modules/coaching
  - modules/training
  - modules/athlete-history
  - app/api/schools
  - prisma/schema.prisma
owns:
  - temporal school memberships and roles
  - coach assignments and derived lobby
  - prescriptions, matching and sport-specific compliance
  - explicit athlete history access grants
depends_on:
  - existing User identity and auth session
  - persisted normalized Activity data
  - Prisma transactions
invariants:
  - athleteId is User.id; do not duplicate AthleteProfile
  - school roles are unrelated to global ADMIN
  - no provider imports or remote activity refetch
  - historical foreign keys Restrict; ending relationships never deletes history
  - ownership, authorship and access are separate
conventions:
  ids: String cuid generated by Prisma; validate nonempty opaque IDs without rewriting them
  timestamps: UTC Date in domain and persistence; ISO 8601 in HTTP; inject clock in use cases
  temporal: startedAt null while pending; endedAt terminates a period; return creates a new row
  soft_delete: explicit status and endedAt/revokedAt/archivedAt; no normal hard-delete commands
  errors: typed domain error with stable code and safe message; HTTP code/message/details envelope
  error_status: validation 400; unauthenticated 401; forbidden 403; absent 404; conflict 409
  pagination: default 20 and maximum 100; fetch limit+1; stable ID tie-breaker
  cursor: opaque validated ID cursor for ID-ordered queries; composite date+ID for chronological queries
  response: single resources directly; lists as items/nextCursor; no fabricated totals
  validation: strict Zod DTOs at boundary and domain invariant checks in use cases
  authorization: authenticated actor from server session; never trust owner/roles supplied by clients
  transactions: compound state changes and audit records commit together
  feature_flag: SCHOOL_MODULE_ENABLED defaults disabled; gate server entrypoints and job consumers
validation:
  - focused Vitest tests with RED before behavior implementation
  - tsc --noEmit and area ESLint
  - real isolated PostgreSQL migrations and constraint tests
  - GitNexus impact before existing symbol changes and detect-changes before commits
references:
  - architecture/ryvano-escola-integration.md
  - architecture/adr/school
  - .kiro/specs/ryvano-escola-spec/implementation.md
