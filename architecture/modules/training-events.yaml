  - school.yaml        # prescrição, matching, compliance, ficha técnica, escopo independente
  - marketplace.yaml   # planos autorais versionados e adaptação decidida pelo atleta
  - shared-activities.yaml  # atividade canônica, ausência ≠ zero, espelho entre conexões

# §21.1 — conceito do documento → modelo. "reuse" = já existe e é estendido;
# "new" = tabela/entidade nova criada pela sub-issue indicada. Nenhuma
# entidade do documento ganha uma segunda tabela concorrente (§26.4).
