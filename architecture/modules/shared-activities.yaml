id: shared.activities
name: Shared Activities
status: active

owns:
  - canonical sport taxonomy
  - activity normalization rules
  - activity presentation models
  - cross-provider reconciliation policy
  - heart-rate and metric display helpers
  - rich activity detail and daily health contracts (contracts/rich.ts, SAM-45, ADR-005)
  - source resolution — one provider per field, labelled (source-resolution/, SAM-45)

paths:
  - modules/shared/activities

depends_on:
  - shared.integrations for capability-aware presentation
  - provider parsers for normalized input

consumed_by:
  - app/app/dashboard
  - app/app/atividades
  - app/app/atividades/[id]
  - app/app/relatorios
  - Garmin presentation
  - Strava presentation

invariants:
  - provider values must be normalized before shared consumption
  - canonical sport taxonomy is provider-independent
  - raw provider identifiers must remain available when needed
  - conflicting provider activities must not be silently merged
  - reconciliation must not auto-merge
  - adding a sport requires impact analysis across parsers, reports, and UI
  - absence is never zero: every field of NormalizedActivityDetail / NormalizedDailyHealth is optional or null (ADR-005)
  - proprietary scores (Body Battery, Training Effect, Nightly Recharge, PAI) are carried with the provider's label, never converted to another scale
  - a screen consumes the resolved detail/health with its `sources`; it never reads a provider's raw JSON nor compares providerId to a literal
  - source resolution chooses ONE provider per block/field; with cross-provider combination disabled (policy default) the whole activity detail comes from the primary connection
  - the same session from two connections is one session (findDuplicateSessions): kept once, never matched twice
  - laps, zones and streams are persisted in ActivityLap / ActivityZone / ActivityStream with sourceProvider + sourceKind; streams are one row per series (ADR-006), never one per sample; a provider's raw JSON blocks are legacy fallback, never the source of a new feature

cross_cutting_impacts:
  sport-taxonomy:
    - garmin
    - strava
    - dashboard
    - activity detail
    - reports
    - whatsapp delivery content
    - tests

official_docs_required_when:
  - changing provider-specific sport mappings

tests:
  - discover from repository

notes:
  - keep provider-agnostic contracts here
  - use GitNexus for consumers and blast radius
