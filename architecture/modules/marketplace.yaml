  - `bash .agents/skills/ryvano-telas/scripts/audit-routes.sh` (static, no DB needed) clean after
    Onda 1: 0 broken links, 0 empty route folders, marketplace pages correctly listed as PUBLICA
    or "guard na propria pagina". `audit-access.sh` (HTTP-based, needs `pnpm dev` + seeded DB)
    could NOT be run in this session — same DB-unreachability constraint as migrations above.
  - Onda 3 (TM072–088): 5 use cases + 5 route adapters + 2 telas do professor (`/professor/acompanhar/**`)
    + extensão de `/app/planos/[licenseId]` (TM084) + 4 eventos de instrumentação (TM086) + E2E
    convite->aceite->ajuste->decisão->revogação (TM087, `tests/e2e-marketplace-coach-followup.test.ts`)
    with explicit coverage of: wrong coach can't accept another's invite, non-owner athlete can't
    decide/revoke, a revoked coach's next call fails server-side, concurrent adaptation proposals
    conflict via `expectedVersion`, and RF-305's swim-only/run-only coexistence on one license.
