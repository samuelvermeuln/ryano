owns:
  - training plan catalog: products, versioned/immutable snapshots, publishing
  - checkout (free + paid via Stripe), license activation, calendar instantiation
    (WorkoutAssignment with trainingLicenseId, workoutId=null)
  - payment confirmation (webhook-only), refund (provider event or audited admin
    action), periodic reconciliation for undelivered provider events — Onda 2, DONE
  - seller ledger: one auditable SellerLedgerEntry per financial event (SALE/REFUND),
    fee/split read from configuration, never a hardcoded percentage — Onda 2, DONE
  - marketplace reviews (verified-purchase only) and media
  - independent coach follow-up on a purchased license (LicenseCoachEngagement, PlanAdaptation) — Onda 3, DONE
    (invite -> accept -> propose adaptation -> athlete decides -> revoke; RF-305 per-modality precedence)
depends_on:
  - school.yaml — CoachProfile, School, CoachSchoolMembership, SchoolRole authorization
  - school.yaml — WorkoutAssignment/WorkoutExecution/WorkoutCompliance (referenced, never duplicated)
  - school.yaml — HistoryAccessGrant (LicenseCoachEngagement is a SEPARATE consent — see invariants)
  - modules/shared/activities/sport-types — RyvanoSportType canonical taxonomy
infrastructure:
  feature_flag: reuses SCHOOL_MODULE_ENABLED today; Q8 (own MARKETPLACE_ENABLED flag or not) is open — see STATUS.md §7
  logging: schoolLogger / schoolMetrics (same as school.yaml — no separate observability stack)
  seed: prisma/seed.ts (extended by TM017/TM056, not a parallel seed script)
invariants:
  - buying a plan NEVER creates a coach-athlete relationship or grants biometric access by itself
  - authorship (who created the plan), selling (who receives payment), licensing (who bought
    the right to use it) and coach follow-up (who is authorized to adapt an instance) are four
    distinct concepts — a person can hold several roles, but none is presumed from another
  - a published TrainingProductVersion is immutable (DB trigger, migration 0037) — content
    changes always create a new version; an athlete's own instance is adapted via PlanAdaptation,
    never by mutating the version they bought
  - the public catalog (no session) NEVER returns DRAFT/SCHOOL_ONLY/ARCHIVED products, regardless
    of client-supplied query parameters (RF-001 — this was a real, fixed defect, not a hypothetical)
  - a purchase is promoted to COMPLETED only by a verified provider webhook or a free-product
    path with no payment reference — never by a client-supplied paymentRef on a public route
  - a LicenseCoachEngagement is NOT a HistoryAccessGrant; accepting one never exposes pre-license
    history or biometrics by itself
  - every calendar date is anchored in the athlete's IANA timezone (modules/school/domain/local-date.ts),
    never UTC midnight — this was also a real, fixed defect (RF-006)
  - a PENDING LicenseCoachEngagement grants NO read/write access — every Onda 3 use case that acts
    on behalf of the invited coach (ProposePlanAdaptation) requires status ACTIVE explicitly, never
    PENDING; only AcceptCoachInvitation may move PENDING -> ACTIVE, and only the invited coach (RF-302)
  - revoking a LicenseCoachEngagement (RevokeCoachEngagement) ends future access IMMEDIATELY at the
    server — every subsequent call by that coach fails on its own ACTIVE-engagement check, not just a
    hidden UI button — and NEVER deletes the engagement or any PlanAdaptation already applied (RF-304)
  - a PlanAdaptation never touches TrainingProductVersion (RF-004) or any other buyer's license — the
    WorkoutAssignment it targets is always looked up scoped to the SAME licenseId the coach's ACTIVE
    engagement covers (RF-303, design D-06)
  - when an engagement's scope is partial ({sportTypes: [...]}), a coach may only propose adaptations
    on sessions of those modalities (WorkoutTemplate.sportType); a second engagement whose scope
    overlaps an existing open one on the same license is rejected at invite time (RF-305)
  - a paid checkout's price/currency/version is always the SERVER's TrainingProduct row at checkout
    time, frozen into offerSnapshot — CreateMarketplaceCheckoutInput has no price field, so a
    divergent client-supplied price is impossible by construction, not just validated away (TM058)
  - refund only from a verified provider event (refund.created) or an audited admin action — never
    a client claim; an admin refund writes a durable AdminAuditLog row, not just a metric (TM065)
  - refunding never deletes WorkoutAssignment/WorkoutExecution history — only revokes the license's
    right to future sessions (status REVOKED); past executions and their authorship stay intact
  - a SellerLedgerEntry's fee is read from configuration (env, MARKETPLACE_PLATFORM_FEE_BPS) at the
    moment of the SALE and persisted on that row; a REFUND entry always mirrors that SAME persisted
    SALE row exactly — it never recomputes from whatever fee config is in effect at refund time
  - `CreateTrainingPurchase` (pre-D-02, accepts a client-supplied paymentRef) is dead code — confirmed
    via GitNexus `impact` (UNKNOWN) + text search: no live route instantiates it, only its own legacy
    unit test does. Not removed here (surgical-change rule) — flagged for a future cleanup task.
