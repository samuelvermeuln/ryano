# Why not a separate `modules/marketplace`: TrainingProduct/TrainingPurchase/
# TrainingLicense already lived in modules/school/ before this spec (T400–T406)
# and depend on CoachProfile/School/WorkoutAssignment — all school-module
# concepts. A separate module would duplicate school/coach authorization
# checks and risk a circular dependency. This is a deliberate, documented
# debt (design.md D-01 in the spec-kit): if the marketplace's code volume
# grows far past this spec, extracting modules/marketplace later is a
# justified refactor — not done now, per the surgical-change rule.
